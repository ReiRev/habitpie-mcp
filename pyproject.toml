[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "habitpie-mcp"
version = "0.1.0"
description = "MCP server for Habitify built on top of habitipie"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "habitipie",
    "mcp[cli]>=1.27.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0,<2.0.0",
    "pre-commit>=4.1.0,<5.0.0",
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.11.0,<0.12.0",
]

[project.scripts]
habitpie-mcp = "habitpie_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["habitpie_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["habitpie_mcp"]

[tool.mypy]
python_version = "3.10"
files = ["habitpie_mcp", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

